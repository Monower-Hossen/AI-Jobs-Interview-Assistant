[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-ignore = [
    "BLE001",
    "S110",
    "DTZ005",
    "DTZ007",
    "SIM102",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"frontend/user/User_profile.py" = ["N999"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
mypy_path = "."
exclude = [".venv/", "venv/", "data/"]

[[tool.mypy.overrides]]
module = [
    "services.auth_service",
    "services.knowledge_base",
    "services.roadmap_service",
]
disable_error_code = ["assignment", "arg-type", "return-value"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "backend"]

[tool.black]
line-length = 100
target-version = ["py311"]

[project]
name = "ai-interview-assistant"
version = "1.0.0"
description = "AI-powered interview preparation platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pypdf>=3.15.0",
    "python-docx>=1.1.0",
    "python-magic>=0.4.27",
    "python-magic-bin>=0.4.14; platform_system == 'Windows'",
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "faster-whisper>=1.0.0",
    "langchain-text-splitters>=0.2.0",
    "google-genai>=1.0.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.7.0",
    "streamlit>=1.35.0",
    "streamlit-webrtc==0.79.1",
    "python-dotenv>=1.0.0",
    "pandas>=2.2.0",
    "plotly>=5.20.0",
    "numpy>=1.26.0",
    "pydub>=0.25.1",
    "reportlab>=4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "black>=24.0.0",
    "mypy>=1.10.0",
]
